# Publishes the site to GitHub Pages every time something is pushed to the main branch
# (the hourly robot also asks for this after it commits fresh data).
# It gathers the site/ folder plus the config and seed data into one bundle, decides which page is
# the front door (coming-soon before day 1 of the plan, the home page from day 1), then deploys it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # queue, never cancel: a cancelled Pages deploy blocks the next one

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gather the files to publish
        run: |
          rm -rf _pages
          mkdir -p _pages/config _pages/data _pages/archive
          cp -R site/. _pages/
          cp config/site.config.json _pages/config/
          cp seed/route_line.json seed/countries.json seed/americas.json seed/countries_outlines.json seed/route_elevation.json seed/day_geo.json _pages/data/
          cp -R archive/. _pages/archive/ 2>/dev/null || true
          touch _pages/.nojekyll
          FRONT=$(node scripts/which-index.js)
          echo "Front door: $FRONT"
          if [ "$FRONT" = "home" ] && [ -f site/home.html ]; then cp site/home.html _pages/index.html; else cp site/coming-soon.html _pages/index.html; fi
          # Stamp every stylesheet and script address with this commit, so browsers never keep an old copy
          V="${GITHUB_SHA::8}"
          find _pages -name "*.html" -exec sed -i -E "s#(css/[a-z-]+\.css|js/[a-z-]+\.js)\"#\1?v=$V\"#g" {} +
          grep -o 'site.css?v=[a-f0-9]*' _pages/home.html | head -1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
