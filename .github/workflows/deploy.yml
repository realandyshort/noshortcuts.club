# Publishes the site to GitHub Pages every time something is pushed to the main branch.
# It gathers the site/ folder plus the config and seed data into one bundle, then deploys it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather the files to publish
        run: |
          rm -rf _pages
          mkdir -p _pages/config _pages/data
          cp -R site/. _pages/
          cp config/site.config.json _pages/config/
          cp seed/route_line.json _pages/data/
          cp seed/countries.json _pages/data/
          touch _pages/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
