<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161412">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,500;0,600;1,500;1,600&family=Bricolage+Grotesque:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <title>All the days · No Shortcuts</title>
  <meta name="description" content="Every planned day from Deadhorse to Ushuaia.">
</head>
<body data-page="days">
  <!-- Header: wordmark and a row of pill buttons. Labels and links are filled from config by js/site.js. -->
  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="home.html" data-href="home"><span data-config="menu.wordmark">Andy</span> <em data-config="menu.wordmarkEm">Short.</em></a>
      <ul class="menu" id="menu">
        <li><a href="home.html" data-href="home" data-config="menu.map">Map</a></li>
        <li><a href="#" data-href="routePlan" data-config="menu.routePlan">Route plan</a></li>
        <li><a href="about.html" data-href="about" data-config="menu.about">About</a></li>
      </ul>
      <a class="btn btn-persimmon header-subscribe" href="https://noshortcutsclub.substack.com" data-href="substack" data-config="menu.subscribe">Subscribe</a>
    </div>
  </header>

  <main class="section days-list">
    <div class="wrap">
      <h1 data-config="copy.days.allTitle">All the days</h1>
      <p class="intro" data-config="copy.days.allIntro"></p>
      <div id="days-sections"></div>
    </div>
  </main>

  <!-- Footer: one ask (the Substack email field), then the small secondary buttons. All wording from config. -->
  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-signup">
        <h2 class="footer-title"><span data-config="copy.footer.title">Don’t miss a</span> <em data-config="copy.footer.titleEm">mile.</em></h2>
        <p class="footer-blurb" data-config="copy.footer.blurb">Every story, voice note and video from the road, sent to your inbox as it goes up.</p>
        <form class="signup-form" data-signup action="https://noshortcutsclub.substack.com/subscribe" method="get" target="_blank">
          <label class="signup-prompt" for="footer-email" data-config="copy.signup.prompt">Get your updates delivered.</label>
          <div class="signup-field">
            <input id="footer-email" type="email" name="email" required autocomplete="email" placeholder="your@email.com" data-placeholder="copy.signup.placeholder">
            <button class="btn btn-persimmon" type="submit" data-config="copy.signup.button">Sign up</button>
          </div>
        </form>
      </div>
      <div class="footer-secondary">
        <div class="follow-buttons">
          <a class="btn btn-small btn-outline-ink" href="#" data-href="listen" data-config="copy.footer.listen">Podcast app</a>
          <a class="btn btn-small btn-outline-ink" href="#" data-href="instagram" data-config="copy.footer.instagram">Instagram</a>
          <a class="btn btn-small btn-outline-ink" href="#" data-href="youtube" data-when-videos data-config="copy.footer.youtube" hidden>YouTube</a>
        </div>
        <p class="say-hi"><span data-config="copy.footer.sayHi">Say hi:</span> <a href="mailto:hello@noshortcuts.club" data-href="email" data-config="site.email">hello@noshortcuts.club</a></p>
      </div>
    </div>
  </footer>

  <script src="js/trip.js"></script>
  <script src="js/site.js"></script>
  <script src="js/days.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
