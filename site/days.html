<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161412">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,500;0,600;1,500;1,600&family=Bricolage+Grotesque:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <title>All the days · No Shortcuts</title>
  <meta name="description" content="Every planned day from Deadhorse to Ushuaia.">
</head>
<body data-page="days">
  <!-- Header: wordmark and a row of pill buttons. Labels and links are filled from config by js/site.js. -->
  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="home.html" data-href="home"><span data-config="menu.wordmark">Andy</span> <em data-config="menu.wordmarkEm">Short.</em></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <ul class="menu" id="menu">
        <li><a href="home.html" data-href="home" data-config="menu.map">Map</a></li>
        <li><a href="#" data-href="listen" data-config="menu.dispatches">Dispatches</a></li>
        <li><a href="#" data-href="instagram" data-config="menu.pictures">Pictures</a></li>
        <li><a href="#" data-href="routePlan" data-config="menu.routePlan">Route plan</a></li>
        <li><a href="about.html" data-href="about" data-config="menu.about">About</a></li>
      </ul>
    </div>
  </header>

  <main class="section days-list">
    <div class="wrap">
      <h1 data-config="copy.days.allTitle">All the days</h1>
      <p class="intro" data-config="copy.days.allIntro"></p>
      <div id="days-sections"></div>
    </div>
  </main>

  <!-- Footer "Follow along". Everything here comes from config. -->
  <footer class="site-footer">
    <div class="wrap">
      <div>
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M20.5 4.2 C20.1 11 19.8 27 19.6 35.6"/><path d="M6.8 11.6 C13 15.4 26 23.5 33.4 28.1"/><path d="M33.9 11 C27.5 15.8 13.4 24.6 6.2 28.9"/></g></svg>
        <h2 data-config="copy.footer.title">Follow along</h2>
        <p data-config="copy.footer.blurb">Dispatches every few days, a video every week, photos as they happen.</p>
        <div class="follow-buttons">
          <a class="btn btn-persimmon" href="#" data-href="listen" data-config="copy.footer.listen">Listen in your podcast app</a>
          <a class="btn btn-ink" href="#" data-href="youtube" data-when-videos data-config="copy.footer.youtube" hidden>Watch on YouTube</a>
          <a class="btn btn-ink" href="#" data-href="instagram" data-config="copy.footer.instagram">Instagram</a>
          <a class="btn btn-ink" href="#" data-href="substack" data-config="copy.footer.substack">Subscribe on Substack</a>
          <a class="btn btn-outline-ink" href="#" data-href="email" data-config="copy.footer.emailButton">Email me</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/trip.js"></script>
  <script src="js/site.js"></script>
  <script src="js/days.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
